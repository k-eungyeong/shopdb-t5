[project]
name = "t5-backend-shopdb2"
version = "0.1.0"
description = "shopdb2 t5팀 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymysql",
    "sqlalchemy",
    "python-dotenv",
]

[tool.uv]
package = false   # main.py로 직접 실행하는 앱이라 패키지 빌드는 안 함